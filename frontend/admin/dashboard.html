<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ExpoFeriasCR</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-dashboard.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="dashboard-header">
            <h1>Panel de Administración</h1>
            <div>
                <a href="usuarios.html" class="btn btn-secondary">Gestionar Usuarios</a>
                <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>

        <div class="toolbar">
            <button id="btnCrearEvento" class="btn btn-primary">+ Nuevo Evento</button>
            <button id="btnEliminarSeleccionados" class="btn btn-danger" disabled>🗑️ Eliminar seleccionados</button>
        </div>

        <div class="filtro-fechas">
            <h3>Eliminar eventos por fecha</h3>
            <div class="date-range">
                <input type="date" id="fecha_inicio_eliminar" placeholder="Fecha inicio">
                <span>a</span>
                <input type="date" id="fecha_fin_eliminar" placeholder="Fecha fin">
                <button id="btnEliminarPorFecha" class="btn btn-warning">Eliminar eventos en rango</button>
            </div>
        </div>

        <div id="listaEventos" class="eventos-list">
            <p>Cargando eventos...</p>
        </div>
    </div>

    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
