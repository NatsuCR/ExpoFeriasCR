<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-9004819107277432">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ExpoFeriasCR</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/confirm-modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="../js/helpers.js?v=3"></script>
</head>
<body class="admin-body">
    <div class="admin-container">

        <div class="dashboard-header">
            <div class="header-main-row">
                <h1>Panel de Administración</h1>
                <button id="adminMenuToggle" class="admin-menu-toggle" aria-label="Abrir menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            <div class="header-buttons" id="adminHeaderButtons">
                <a href="../index.html" class="btn btn-secondary"><i class="fas fa-home"></i> Ir al Inicio</a>
                <a href="eventos-pendientes.html" class="btn btn-warning">⏳ Eventos Pendientes <span id="badge-pendientes-header" class="badge-contador" style="display: none;">0</span></a>
                <a href="usuarios.html" class="btn btn-secondary">Gestionar Usuarios</a>
                <a href="baneados.html" class="btn btn-secondary" style="background-color: #34495e; color: white;"><i class="fas fa-ban"></i> Baneados Chat</a>
                <a href="stats.html" class="btn btn-primary">📊 Estadísticas</a>
                <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>

        <div class="toolbar" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
            <div class="search-container" style="flex:1; max-width:400px; display:flex; align-items:center; background:#fff; border-radius:8px; border:1px solid #ddd; padding:5px 15px;">
                <i class="fas fa-search" style="color:#888;"></i>
                <input type="text" id="buscadorEventos" placeholder="Buscar evento por nombre o ubicación..." style="border:none; outline:none; padding:8px; width:100%; font-size:14px;">
            </div>
            <button id="btnCrearEvento" class="btn btn-primary">+ Nuevo Evento</button>
        </div>

        <div class="dashboard-sections">
            <div class="dashboard-section">
                <div class="section-header recientes">
                    <span class="section-icon">🕐</span>
                    <h3>Agregados Recientemente</h3>
                    <span class="badge" id="badgeRecientes">0</span>
                </div>
                <div class="section-body" id="listaRecientes">
                    <p class="section-empty">Cargando...</p>
                </div>
            </div>
            <div class="dashboard-section">
                <div class="section-header cronologico">
                    <span class="section-icon">📅</span>
                    <h3>Orden Cronológico</h3>
                    <span class="badge" id="badgeCronologico">0</span>
                </div>
                <div class="section-body" id="listaCronologico">
                    <p class="section-empty">Cargando...</p>
                </div>
            </div>
        </div>

        <div class="filtro-fechas">
            <h3>Gestión masiva de eventos</h3>
            <div class="date-range-container">
                <div class="date-range-group">
                    <input type="date" id="fecha_inicio_eliminar">
                    <span>—</span>
                    <input type="date" id="fecha_fin_eliminar">
                    <button id="btnEliminarPorFecha" class="btn btn-warning">Eliminar en rango</button>
                </div>
                
                <div class="selection-group">
                    <div class="select-all-wrapper">
                        <input type="checkbox" id="selectAll">
                        <label for="selectAll">Seleccionar todos</label>
                    </div>
                    <button id="btnEliminarSeleccionados" class="btn btn-danger" disabled>🗑️ Eliminar seleccionados</button>
                </div>
            </div>
        </div>

        <div class="lista-header">
            <h3>Todos los Eventos</h3>
        </div>

        <div id="listaEventos" class="eventos-list">
            <p>Cargando eventos...</p>
        </div>

    </div>

    <script src="js/dashboard.js?v=1.1"></script>
    <script src="js/inactivity.js"></script>
</body>
</html>
