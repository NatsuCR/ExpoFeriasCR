<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ExpoFeriasCR</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        /* Estilos adicionales para el dashboard */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .btn-logout {
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
        .evento-item {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .evento-info {
            flex: 1;
        }
        .evento-actions button {
            margin-left: 0.5rem;
        }
        .btn-warning {
            background-color: #f0ad4e;
            color: white;
        }
        .btn-danger {
            background-color: #d9534f;
            color: white;
        }
        .btn-primary {
            background-color: #5bc0de;
            color: white;
        }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="dashboard-header">
            <h1>Panel de Administración</h1>
            <a href="usuarios.html" class="btn btn-primary" style="background-color: #6c757d;">Gestionar Usuarios</a>
            <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
        </div>
        <div>
            <button id="btnCrearEvento" class="btn btn-primary">+ Nuevo Evento</button>
        </div>
        <div id="listaEventos" style="margin-top: 2rem;">Cargando eventos...</div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Cerrar sesión
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        async function fetchAPI(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            if (res.status === 401) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
            return res.json();
        }

        async function cargarEventos() {
            const eventos = await fetchAPI('/api/admin/eventos');
            const container = document.getElementById('listaEventos');
            if (eventos.length === 0) {
                container.innerHTML = '<p>No hay eventos registrados.</p>';
                return;
            }
            let html = '';
            eventos.forEach(e => {
                html += `
                    <div class="evento-item">
                        <div class="evento-info">
                            <strong>${e.nombre}</strong> (${e.slug})<br>
                            ${new Date(e.fecha_inicio).toLocaleDateString()} al ${new Date(e.fecha_fin).toLocaleDateString()}<br>
                            ${e.ubicacion}
                        </div>
                        <div class="evento-actions">
                            <button class="btn btn-warning" data-id="${e.id}">Editar</button>
                            <button class="btn btn-danger" data-id="${e.id}">Eliminar</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.querySelectorAll('.btn-warning').forEach(btn => {
                btn.addEventListener('click', () => editarEvento(btn.dataset.id));
            });
            document.querySelectorAll('.btn-danger').forEach(btn => {
                btn.addEventListener('click', () => eliminarEvento(btn.dataset.id));
            });
        }

        function editarEvento(id) {
            window.location.href = `evento-form.html?id=${id}`;
        }

        async function eliminarEvento(id) {
            if (confirm('¿Eliminar evento? Se borrarán también precios, actividades, expositores y galería.')) {
                await fetchAPI(`/api/admin/eventos/${id}`, { method: 'DELETE' });
                cargarEventos();
            }
        }

        document.getElementById('btnCrearEvento').onclick = () => {
            window.location.href = 'evento-form.html';
        };

        cargarEventos();
    </script>
</body>
</html>
