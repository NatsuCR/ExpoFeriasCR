<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - Login ExpoFeriasCR</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background: var(--color-crema); display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: white; padding: 2rem; border-radius: 20px; width: 300px;">
        <h2>Acceso Administrador</h2>
        <input type="email" id="email" placeholder="Email" style="width:100%; padding:8px; margin:10px 0;">
        <input type="password" id="password" placeholder="Contraseña" style="width:100%; padding:8px; margin:10px 0;">
        <button id="btnLogin" style="background: var(--color-cuero); color:white; padding:10px; border:none; width:100%;">Ingresar</button>
        <div id="error" style="color:red; margin-top:10px;"></div>
    </div>
    <script>
        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    document.getElementById('error').innerText = data.error || 'Error de autenticación';
                }
            } catch (err) {
                document.getElementById('error').innerText = 'Error de conexión';
            }
        });
    </script>
</body>
</html>
