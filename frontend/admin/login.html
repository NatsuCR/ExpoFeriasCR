<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ExpoFeriasCR</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-responsive.css">
</head>
<body class="admin-body">
    <div class="login-container">
        <h2>Acceso Administrador</h2>
        <input type="email" id="email" placeholder="Correo electrónico" autocomplete="off">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btnLogin">Iniciar sesión</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        const btn = document.getElementById('btnLogin');
        const errorDiv = document.getElementById('errorMsg');

        btn.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorDiv.innerText = 'Por favor complete ambos campos.';
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.innerText = data.error || 'Credenciales incorrectas';
                }
            } catch (err) {
                errorDiv.innerText = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
