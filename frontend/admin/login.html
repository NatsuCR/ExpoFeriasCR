<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ExpoFeriasCR</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="admin-body">
    <div class="login-container">
        <h2>Acceso Administrador</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Correo electrónico" autocomplete="off" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" id="btnLogin">Iniciar sesión</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>

        <script src="js/login.js"></script>

</body>
</html>
