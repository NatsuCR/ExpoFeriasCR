<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Usuarios - Admin</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-responsive.css">
    <link rel="stylesheet" href="../css/admin-usuarios.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="dashboard-header">
            <h1>Gestionar Usuarios Administradores</h1>
            <a href="dashboard.html" class="btn btn-volver">← Volver al Dashboard</a>
        </div>

        <div id="globalMessage" class="message"></div>

        <div class="form-usuario">
            <h3>Crear nuevo administrador</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Carlos Rodríguez">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="******">
                </div>
            </div>
            <button id="btnCrearUsuario" class="btn btn-success">Crear Usuario</button>
        </div>

        <div class="toolbar">
            <button id="btnEliminarSeleccionados" class="btn btn-danger" disabled>🗑️ Eliminar seleccionados</button>
        </div>

        <h3>Usuarios existentes</h3>
        <div id="listaUsuarios">Cargando...</div>
    </div>

    <script src="../js/admin-usuarios.js"></script>
    <script src="../js/admin-inactivity.js"></script>
</body>
</html>
