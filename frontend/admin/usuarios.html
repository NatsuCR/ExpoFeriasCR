<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Usuarios - Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="icon" type="image/x-icon" href="/assets/images/IconoOficialExpoFeriasCR/LogoExpoFeriasCR1.ico">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .form-usuario {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-success { background-color: #27ae60; color: white; }
        .btn-volver { background-color: #6c757d; color: white; text-decoration: none; display: inline-block; }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .data-table th, .data-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        .data-table th {
            background-color: #f0f0f0;
        }
        .message {
            padding: 10px;
            margin-bottom: 1rem;
            border-radius: 4px;
            display: none;
        }
        .message-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body class="admin-body">
    <div class="admin-container">
        <div class="dashboard-header">
            <h1>Gestionar Usuarios Administradores</h1>
            <a href="dashboard.html" class="btn btn-volver">← Volver al Dashboard</a>
        </div>

        <div id="globalMessage" class="message"></div>

        <div class="form-usuario">
            <h3>Crear nuevo administrador</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Carlos Rodríguez">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="admin@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="******">
                </div>
            </div>
            <button id="btnCrearUsuario" class="btn btn-success">Crear Usuario</button>
        </div>

        <h3>Usuarios existentes</h3>
        <div id="listaUsuarios">Cargando...</div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('globalMessage');
            div.className = `message message-${tipo}`;
            div.innerText = texto;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 4000);
        }

        async function fetchAPI(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; }
            return res.json();
        }

        async function cargarUsuarios() {
            const usuarios = await fetchAPI('/api/admin/usuarios');
            const container = document.getElementById('listaUsuarios');
            if (usuarios.length === 0) {
                container.innerHTML = '<p>No hay usuarios registrados.</p>';
                return;
            }
            let html = '<table class="data-table"><thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Activo</th><th>Acciones</th></tr></thead><tbody>';
            usuarios.forEach(u => {
                html += `<tr>
                    <td>${u.id}</td>
                    <td>${u.nombre}</td>
                    <td>${u.email}</td>
                    <td>${u.rol}</td>
                    <td>${u.activo ? 'Sí' : 'No'}</td>
                    <td><button class="btn btn-danger btn-eliminar" data-id="${u.id}">Eliminar</button></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            document.querySelectorAll('.btn-eliminar').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('¿Eliminar este usuario?')) {
                        await fetchAPI(`/api/admin/usuarios/${btn.dataset.id}`, { method: 'DELETE' });
                        cargarUsuarios();
                        mostrarMensaje('Usuario eliminado', 'success');
                    }
                });
            });
        }

        document.getElementById('btnCrearUsuario').addEventListener('click', async () => {
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!nombre || !email || !password) {
                mostrarMensaje('Todos los campos son obligatorios', 'error');
                return;
            }
            try {
                const result = await fetchAPI('/api/admin/usuarios', {
                    method: 'POST',
                    body: JSON.stringify({ nombre, email, password, rol: 'admin' })
                });
                if (result.error) {
                    mostrarMensaje(result.error, 'error');
                } else {
                    mostrarMensaje(`Usuario ${result.email} creado correctamente`, 'success');
                    document.getElementById('nombre').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '';
                    cargarUsuarios();
                }
            } catch (err) {
                mostrarMensaje('Error al crear usuario', 'error');
            }
        });

        cargarUsuarios();
    </script>
</body>
</html>
