        body {

            cursor: pointer;
            text-decoration: none;
            margin-top: 15px;
            transition: background 0.3s ease;
        }

        .btn-skip:hover {
            background: #002277;
        }

        .ad-vertical-left, .ad-vertical-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            z-index: 10;
        }

        .ad-vertical-left {
            left: 20px;
        }

        .ad-vertical-right {
            right: 20px;
        }

        /* Mostrar solo en pantallas grandes donde haya espacio a los lados */
        @media (min-width: 1200px) {
            .ad-vertical-left, .ad-vertical-right {
                display: block;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('url');
            
            const u = JSON.parse(localStorage.getItem('usuario') || 'null');
            if (u && u.rol === 'admin' && targetUrl) {
                window.location.replace(targetUrl);
                return;
            }
            
            const countdownEl = document.getElementById('countdown');
            const skipBtn = document.getElementById('skip-btn');
            const popunderOverlay = document.getElementById('popunder-overlay');
            const dynamicImg = document.getElementById('dynamic-img');
            const imgUrl = urlParams.get('img');

            if (imgUrl && imgUrl !== 'null' && imgUrl !== '') {
                dynamicImg.src = imgUrl;
                dynamicImg.style.maxHeight = '55vh';
                dynamicImg.style.height = '100%';
                dynamicImg.style.width = 'auto';
                dynamicImg.style.maxWidth = '100%';
                dynamicImg.style.objectFit = 'contain';
                dynamicImg.style.borderRadius = '10px';
            }

            let timeLeft = 6;

            if (!targetUrl) {
                window.location.href = '/';
                return;
            }

            skipBtn.href = targetUrl;
            skipBtn.target = '_blank';
            popunderOverlay.href = targetUrl;

            const closeBtn = document.getElementById('ad-popup-close');

            const timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    countdownEl.closest('#countdown').style.display = 'none';
                    // Solo mostrar el botón - el usuario DEBE hacer clic para continuar
                    skipBtn.style.display = 'inline-block';
                    // Hacer toda la pantalla clickeable
                    popunderOverlay.style.display = 'block';
                }
            }, 1000);

            skipBtn.addEventListener('click', () => {
                if (closeBtn) closeBtn.style.display = 'block';
                popunderOverlay.style.display = 'none'; // Desactivar overlay si da clic al botón
            });

            popunderOverlay.addEventListener('click', () => {
                if (closeBtn) closeBtn.style.display = 'block';
                popunderOverlay.style.display = 'none'; // Desactivar para que el usuario pueda usar la página
            });

            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    window.location.href = '/';
                });
            }
        });
    </script>
