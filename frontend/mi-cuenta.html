<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-9004819107277432">
    <meta name="google-adsense-account" content="ca-pub-9004819107277432">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9004819107277432"
     crossorigin="anonymous"></script>

    <meta name="keywords" content="expo, ferias, eventos nacionales, eventos internacionales, eventos globales, transmisiones en vivo, futbol, nba, deportes, eventos deportivos, conciertos, convenciones, exposiciones mundiales, entretenimiento en vivo, turismo, guía de eventos, turismo costa rica, eventos costa rica, eventos latinoamerica, actividades familiares, congresos, arte y cultura, gastronomia, fiestas tipicas, topes, talleres y charlas, recreativa, religioso, eventos civicos">
    <title>Mi Cuenta | ExpoFeriasCR</title>
    <link rel="icon" type="image/png" href="/assets/images/IconoOficialExpoFeriasCR/expoferiascrLogoOficial.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/base.css?v=9.0">
    <link rel="stylesheet" href="css/layout.css?v=9.0">
    <link rel="stylesheet" href="css/components.css?v=9.0">
    <link rel="stylesheet" href="css/mi-cuenta/layout.css?v=9.0">
    <link rel="stylesheet" href="css/mi-cuenta/modales.css?v=9.0">
    <link rel="stylesheet" href="css/mi-cuenta/responsive.css?v=9.0">
    <link rel="stylesheet" href="css/confirm-modal.css?v=9.0">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <img src="assets/images/IconoOficialExpoFeriasCR/expoferiascrLogoOficial.png" alt="ExpoFeriasCR">
                <span>ExpoFeriasCR</span>
            </div>
            <button id="btn-volver-cuenta" class="btn-navbar-back">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </div>
    </nav>

    <div class="container mi-cuenta-container">
        <!-- Header -->
        <div class="cuenta-header">
            <h1>👤 Mi Cuenta</h1>
            <p>Gestiona tu perfil y tus eventos</p>
        </div>

        <!-- Perfil del Usuario -->
        <section class="seccion-perfil">
            <div class="perfil-card">
                <div class="perfil-info">
                    <div class="perfil-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="perfil-datos">
                        <h2 id="perfil-nombre">Cargando...</h2>
                        <p id="perfil-email">email@ejemplo.com</p>
                        <p id="perfil-miembro" class="perfil-miembro">Miembro desde hace poco</p>
                    </div>
                </div>
                <div class="perfil-acciones">
                    <button id="btn-cambiar-password" class="btn-secondary">
                        <i class="fas fa-key"></i> Cambiar Contraseña
                    </button>
                    <button id="btn-logout" class="btn-danger">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                    <button id="btn-eliminar-cuenta" class="btn-danger-outline">
                        <i class="fas fa-user-slash"></i> Eliminar Cuenta
                    </button>
                </div>
            </div>
        </section>

        <!-- Crear Nuevo Evento -->
        <section class="seccion-crear-evento">
            <button id="btn-crear-evento" class="btn-crear-grande">
                <i class="fas fa-plus-circle"></i>
                <span>
                    <strong>Crear Nuevo Evento</strong>
                    <small>Crea un evento y comparte con la comunidad</small>
                </span>
            </button>
        </section>

        <!-- Mis Eventos -->
        <section class="seccion-eventos">
            <div class="seccion-header">
                <h2>📋 Mis Eventos</h2>
                <p>Aquí puedes ver todos los eventos que has creado</p>
                <div class="bulk-actions-container" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                    <label for="seleccionar-todos-eventos" style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px; color:#555; width:fit-content;">
                        <input type="checkbox" id="seleccionar-todos-eventos" title="Seleccionar todos"> 
                        <span>Seleccionar todos</span>
                    </label>
                    <button type="button" id="btn-eliminar-seleccionados" class="btn-danger" style="padding:6px 12px; font-size:12px; border:none; border-radius:4px; opacity:0.5; pointer-events:none; transition:0.3s; width:fit-content;">
                        <i class="fas fa-trash-alt"></i> Eliminar Seleccionados
                    </button>
                </div>
            </div>

            <div id="eventos-contenedor" class="eventos-grid">
                <div class="evento-card-loading">
                    <div class="spinner"></div>
                    <p>Cargando eventos...</p>
                </div>
            </div>
        </section>

        <!-- Modal de cambio de contraseña -->
        <div id="modal-cambiar-password" class="modal-overlay" style="display: none;">
            <div class="modal-contenedor">
                <div class="modal-header">
                    <h3>Cambiar Contraseña</h3>
                    <button id="btn-cerrar-modal-password" class="btn-cerrar-modal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <form id="form-cambiar-password" class="modal-form">
                    <!-- Campo oculto para accesibilidad de gestores de contraseñas -->
                    <input type="text" name="email" id="email-hidden" style="display:none;" autocomplete="username">
                    
                    <div class="form-group">
                        <label>Nueva Contraseña</label>
                        <input type="password" id="nueva-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label>Confirmar Contraseña</label>
                        <input type="password" id="confirmar-password" placeholder="Confirma tu contraseña" autocomplete="new-password" required>
                    </div>

                    <div id="mensaje-password" class="modal-mensaje" style="display: none;"></div>

                    <div class="modal-acciones">
                        <button type="button" id="btn-cancelar-password" class="btn-secondary">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal de detalles del evento -->
        <div id="modal-evento-detalles" class="modal-overlay" style="display: none;">
            <div class="modal-contenedor modal-grande">
                <div class="modal-header">
                    <h3 id="modal-evento-titulo">Evento</h3>
                    <button id="btn-cerrar-modal-evento" class="btn-cerrar-modal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="modal-body">
                    <div id="modal-evento-contenido"></div>
                </div>

                <div class="modal-footer">
                    <button id="btn-editar-evento" class="btn-primary" style="display: none;">
                        <i class="fas fa-edit"></i> Editar
                    </button>
                    <button id="btn-eliminar-evento" class="btn-danger" style="display: none;">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                    <button type="button" class="btn-secondary" onclick="document.getElementById('modal-evento-detalles').style.display='none'">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 ExpoFeriasCR - Todos los derechos reservados</p>
        </div>
    </footer>

    <script src="js/helpers.js?v=3"></script>
    <script src="js/mi-cuenta.js?v=4"></script>
    <script src="js/mi-cuenta/events.js?v=1"></script>
    <script src="js/mi-cuenta/profile.js?v=1"></script>

    <!-- Elemento oculto de Google Translate para mantener funcionalidad -->
    <div id="google_translate_element" style="display: none;"></div>
    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'es',
                includedLanguages: 'en,es,ja,zh-CN',
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
