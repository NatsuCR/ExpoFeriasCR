<!-- MODAL DE AUTENTICACIÓN -->
<div id="modal-auth" class="modal-auth-overlay" style="display: none;">
  <div class="modal-auth-container">
    <!-- Header -->
    <div class="modal-auth-header">
      <h2>ExpoFeriasCR</h2>
      <button id="btn-cerrar-modal-auth" class="btn-cerrar-modal" aria-label="Cerrar modal">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Tabs de navegación -->
    <div class="modal-auth-tabs">
      <button class="modal-auth-tab-btn active" data-tab="login">
        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
      </button>
      <button class="modal-auth-tab-btn" data-tab="registro">
        <i class="fas fa-user-plus"></i> Crear Cuenta
      </button>
      <button class="modal-auth-tab-btn" data-tab="reset">
        <i class="fas fa-key"></i> Recuperar Contraseña
      </button>
    </div>

    <!-- PESTAÑA 1: LOGIN -->
    <div id="tab-login" class="modal-auth-tab-content active">
      <form id="form-login" class="modal-auth-form">
        <div class="form-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary-auth">Iniciar Sesión</button>

        <div class="modal-auth-help">
          <a href="#" id="btn-olvide-contrasena" class="link-help">¿Olvidaste tu contraseña?</a>
        </div>

        <div id="mensaje-login" class="modal-auth-mensaje" style="display: none;"></div>
      </form>
    </div>

    <!-- PESTAÑA 2: REGISTRO -->
    <div id="tab-registro" class="modal-auth-tab-content">
      <form id="form-registro" class="modal-auth-form">
        <div class="form-group">
          <label for="registro-nombre">Nombre Completo</label>
          <input type="text" id="registro-nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <div class="form-group">
          <label for="registro-email">Correo Electrónico</label>
          <input type="email" id="registro-email" name="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="registro-password">Contraseña</label>
          <input type="password" id="registro-password" name="password" placeholder="Mínimo 6 caracteres" required>
          <small style="color: #666;">Debe tener al menos 6 caracteres</small>
        </div>

        <div class="form-group">
          <label for="registro-password-confirm">Confirmar Contraseña</label>
          <input type="password" id="registro-password-confirm" name="passwordConfirm" placeholder="Confirma tu contraseña" required>
        </div>

        <div class="form-group checkbox">
          <input type="checkbox" id="registro-terminos" name="terminos" required>
          <label for="registro-terminos">Acepto los términos y condiciones</label>
        </div>

        <button type="submit" class="btn-primary-auth">Crear Cuenta</button>

        <div id="mensaje-registro" class="modal-auth-mensaje" style="display: none;"></div>
      </form>
    </div>

    <!-- PESTAÑA 3: RECUPERAR CONTRASEÑA -->
    <div id="tab-reset" class="modal-auth-tab-content">
      <!-- Paso 1: Solicitar código -->
      <div id="reset-paso-1" class="reset-paso">
        <h3>Recupera tu contraseña</h3>
        <p>Ingresa tu correo electrónico y te enviaremos un código de 6 dígitos</p>

        <form id="form-solicitar-reset" class="modal-auth-form">
          <div class="form-group">
            <label for="reset-email">Correo Electrónico</label>
            <input type="email" id="reset-email" name="email" placeholder="tu@email.com" required>
          </div>

          <button type="submit" class="btn-primary-auth">Enviar Código</button>

          <div id="mensaje-solicitar-reset" class="modal-auth-mensaje" style="display: none;"></div>
        </form>
      </div>

      <!-- Paso 2: Verificar código y cambiar contraseña -->
      <div id="reset-paso-2" class="reset-paso" style="display: none;">
        <h3>Ingresa el código y tu nueva contraseña</h3>
        <p>Te hemos enviado un código de 6 dígitos a tu correo (válido por 30 minutos)</p>

        <form id="form-cambiar-password" class="modal-auth-form">
          <div class="form-group">
            <label for="reset-codigo">Código de 6 dígitos</label>
            <input type="text" id="reset-codigo" name="codigo" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required>
          </div>

          <div class="form-group">
            <label for="reset-password-nueva">Nueva Contraseña</label>
            <input type="password" id="reset-password-nueva" name="passwordNueva" placeholder="Mínimo 6 caracteres" required>
          </div>

          <div class="form-group">
            <label for="reset-password-confirm">Confirmar Contraseña</label>
            <input type="password" id="reset-password-confirm" name="passwordConfirm" placeholder="Confirma tu contraseña" required>
          </div>

          <button type="submit" class="btn-primary-auth">Cambiar Contraseña</button>

          <div id="mensaje-cambiar-password" class="modal-auth-mensaje" style="display: none;"></div>
        </form>

        <button id="btn-volver-reset" class="btn-volver">← Volver</button>
      </div>
    </div>
  </div>
</div>
